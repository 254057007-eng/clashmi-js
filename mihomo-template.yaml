dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  cache-algorithm: arc
  use-hosts: true
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - rule-set:private-domain
  - rule-set:fakeip-filter
  - rule-set:geolocation-cn
  - +.mygcdn.mobaiemby.site
  - +.mygcns.mobaiemby.site
  - '*.lan'
  - '*.local'
  - +.local
  - +.localhost
  - +.msftconnecttest.com
  - +.msftncsi.com
  - +.market.xiaomi.com
  - time.*.com
  - time.*.gov
  - time.*.edu.cn
  - time.*.apple.com
  - time1.*.com
  - time2.*.com
  - time3.*.com
  - time4.*.com
  - time5.*.com
  - time6.*.com
  - time7.*.com
  - ntp.*.com
  - stun.*.*
  - stun.*.*.*
  default-nameserver:
  - 223.5.5.5#DIRECT
  - 119.29.29.29#DIRECT
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  nameserver:
  - https://dns.google/dns-query#🛡️ DNS防泄露
  - https://doh.opendns.com/dns-query#🛡️ DNS防泄露
  direct-nameserver:
  - 223.6.6.6#DIRECT
  - 119.29.29.29#DIRECT
  direct-nameserver-follow-policy: false
  nameserver-policy:
    rule-set:private-domain,geolocation-cn:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
    mygcdn.mobaiemby.site:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
    mygcns.mobaiemby.site:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
    a.mobaiemby.site:
    - https://dns.google/dns-query#🛡️ DNS防泄露
    - https://doh.opendns.com/dns-query#🛡️ DNS防泄露
    m.20269909.xyz:
    - https://dns.google/dns-query#🛡️ DNS防泄露
    - https://doh.opendns.com/dns-query#🛡️ DNS防泄露
    ? rule-set:ai-domain,tiktok-domain,telegram-domain,google-domain,youtube-domain,netflix-domain,disney-domain,primevideo-domain,hbo-domain
    : - https://dns.google/dns-query#🛡️ DNS防泄露
      - https://doh.opendns.com/dns-query#🛡️ DNS防泄露
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
